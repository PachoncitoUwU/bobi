<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bobi - Asistente Virtual</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="title">
                    <span class="emoji">🤖</span>
                    <span class="title-text">Bobi</span>
                </h1>
                <div class="status">
                    <span class="status-dot" id="statusDot"></span>
                    <span class="status-text" id="statusText">Listo</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main">
            <!-- Avatar -->
            <div class="avatar-container">
                <div class="avatar" id="avatar">
                    <div class="avatar-glow"></div>
                    <div class="avatar-face">
                        <div class="eyes">
                            <div class="eye left-eye" id="leftEye">
                                <div class="pupil"></div>
                            </div>
                            <div class="eye right-eye" id="rightEye">
                                <div class="pupil"></div>
                            </div>
                        </div>
                        <div class="mouth" id="mouth"></div>
                    </div>
                </div>
            </div>

            <!-- Chat Area -->
            <div class="chat-container">
                <div class="chat-messages" id="chatMessages">
                    <div class="message bobi-message">
                        <div class="message-avatar">🤖</div>
                        <div class="message-content">
                            <div class="message-name">Bobi</div>
                            <div class="message-text">¡Hola! Soy Bobi, tu asistente virtual. ¿En qué puedo ayudarte?</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-container">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        class="input-field" 
                        id="inputField" 
                        placeholder="Escribe tu mensaje..."
                        autocomplete="off"
                    >
                    <button class="btn btn-send" id="sendBtn" title="Enviar mensaje">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
                <div class="button-group">
                    <button class="btn btn-voice" id="voiceBtn" title="Hablar con micrófono">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                            <line x1="8" y1="23" x2="16" y2="23"></line>
                        </svg>
                        <span>Hablar</span>
                    </button>
                    <button class="btn btn-clear" id="clearBtn" title="Limpiar chat">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                        <span>Limpiar</span>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
